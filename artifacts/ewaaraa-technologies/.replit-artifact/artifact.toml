kind = "web"
previewPath = "/"
title = "EWAARAA TECHNOLOGIES"
version = "1.0.0"
id = "artifacts/ewaaraa-technologies"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24334

[services.development]
run = "pnpm --filter @workspace/ewaaraa-technologies run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/ewaaraa-technologies", "run", "build" ]
serve = "static"
publicDir = "artifacts/ewaaraa-technologies/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24334"
BASE_PATH = "/"
